
services:
  multi-api:
    container_name: multi-api
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CONFIG_JSON_PATH: /app/endpoints
      LOG_LEVEL: INFO
    volumes:
      - ./endpoints:/app/endpoints:ro
    ports:
      - "3000:8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"